
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MASAR Real Estate | Admin</title>
  <link rel="stylesheet" href="/admin.css">
  <style>
    [hidden] { display: none !important; }
    body { margin: 0; font-family: Arial, sans-serif; }
    .admin-layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
    .sidebar { padding: 24px 16px; background: #171717; color: white; }
    .sidebar h2 { letter-spacing: 2px; }
    .side-link, .sidebar button { display: block; width: 100%; padding: 12px; margin: 6px 0; text-align: left; cursor: pointer; }
    .main-content { padding: 24px; min-width: 0; }
    .topbar, .section-heading, .form-actions, .row-actions { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .stats-grid, .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .panel, .stat-card { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin: 16px 0; }
    label { display: block; margin-bottom: 14px; }
    input, select, textarea { display: block; width: 100%; box-sizing: border-box; padding: 10px; margin-top: 6px; }
    input[type="checkbox"] { display: inline-block; width: auto; }
    button { padding: 10px 14px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { padding: 12px 8px; border-bottom: 1px solid #ddd; text-align: left; }
    td small { display: block; margin-top: 4px; }
    .property-row { display: flex; align-items: center; gap: 10px; }
    .property-thumb { width: 58px; height: 48px; object-fit: cover; }
    .status-pill { display: inline-block; padding: 5px 9px; border-radius: 12px; background: #eee; }
    .danger { color: #a00; }
    .muted, small { color: #777; }
    #propertyEditor { position: fixed; inset: 0; z-index: 1000; background: #0009; overflow-y: auto; padding: 24px; }
    .editor-card { max-width: 900px; margin: 20px auto; padding: 24px; border-radius: 12px; background: white; }
    #imagePreview img { max-width: 110px; max-height: 90px; object-fit: cover; margin: 6px; }
    #adminToast { position: fixed; right: 20px; bottom: 20px; z-index: 2000; padding: 12px 18px; background: #222; color: white; border-radius: 8px; opacity: 0; pointer-events: none; }
    #adminToast.show { opacity: 1; }
    @media (max-width: 760px) {
      .admin-layout { grid-template-columns: 1fr; }
      .stats-grid, .form-grid { grid-template-columns: 1fr; }
      .main-content { padding: 14px; overflow-x: auto; }
      #propertyEditor { padding: 8px; }
      .editor-card { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <h2>MASAR</h2>
      <p>REAL ESTATE</p>
      <p>Welcome, <strong id="adminUsername">Admin</strong></p>

      <button class="side-link active" data-tab="overview">Overview</button>
      <button class="side-link" data-tab="properties">
        Properties & Lands (<span id="sidePropertyCount">0</span>)
      </button>
      <button class="side-link" data-tab="leads">
        Client Leads (<span id="sideLeadCount">0</span>)
      </button>

      <button id="logoutBtn" type="button">Log out</button>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <h1 id="pageTitle">Overview</h1>
        <button id="topAddProperty" type="button">+ Add Property / Land</button>
      </div>

      <section id="loginScreen" class="panel">
        <h2>Admin Login</h2>
        <form id="loginForm">
          <label>
            Username
            <input name="username" autocomplete="username" required>
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit">Sign in</button>
          <p id="loginError" role="alert"></p>
        </form>
      </section>

      <div id="dashboard" hidden>
        <section id="tab-overview" class="tab-panel">
          <div class="stats-grid">
            <div class="stat-card">
              <p>Active properties</p>
              <h2 id="statProperties">0</h2>
            </div>
            <div class="stat-card">
              <p>Total leads</p>
              <h2 id="statLeads">0</h2>
            </div>
            <div class="stat-card">
              <p>New leads</p>
              <h2 id="statNewLeads">0</h2>
            </div>
          </div>

          <div class="panel">
            <div class="section-heading">
              <h2>Recent Client Leads</h2>
              <button type="button" data-goto="leads">View all leads</button>
            </div>
            <div id="recentLeads"></div>
          </div>

          <button id="overviewAddProperty" type="button">
            + Add Property / Land
          </button>
        </section>

        <section id="tab-properties" class="tab-panel" hidden>
          <div class="panel">
            <div class="section-heading">
              <h2>Properties & Lands</h2>
              <button id="addPropertyBtn" type="button">+ Add Listing</button>
            </div>

            <div class="form-grid">
              <label>
                Search listings
                <input id="propertySearch" placeholder="Search title, area or category">
              </label>
              <label>
                Filter by status
                <select id="propertyStatusFilter">
                  <option value="">All statuses</option>
                  <option value="active">Active</option>
                  <option value="hidden">Hidden</option>
                </select>
              </label>
            </div>

            <div id="adminProperties"></div>
          </div>
        </section>

        <section id="tab-leads" class="tab-panel" hidden>
          <div class="panel">
            <div class="section-heading">
              <h2>Client Leads</h2>
              <button id="exportLeads" type="button">Export CSV</button>
            </div>

            <div class="form-grid">
              <label>
                Search leads
                <input id="leadSearch" placeholder="Search name, phone or area">
              </label>
              <label>
                Filter by status
                <select id="leadStatusFilter">
                  <option value="">All statuses</option>
                  <option>New</option>
                  <option>Contacted</option>
                  <option>Follow-up</option>
                  <option>Qualified</option>
                  <option>Closed</option>
                  <option>Not interested</option>
                </select>
              </label>
            </div>

            <div id="adminLeads"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <section id="propertyEditor" hidden>
    <div class="editor-card">
      <div class="section-heading">
        <h2 id="editorTitle">Add a property</h2>
        <button id="closeEditor" type="button">Close</button>
      </div>

      <form id="propertyForm">
        <input type="hidden" name="id">
        <input type="hidden" name="images" value="[]">

        <div class="form-grid">
          <label>
            Title (English) *
            <input name="title" required>
          </label>

          <label>
            Title (Arabic)
            <input name="title_ar" dir="auto">
          </label>

          <label>
            Area *
            <select name="area" required>
              <option value="Sheikh Zayed">Sheikh Zayed</option>
              <option value="6th of October">6th of October</option>
              <option value="Hadayek October">Hadayek October</option>
              <option value="Other">Other</option>
            </select>
          </label>

          <label>
            Other area
            <input name="area_other">
          </label>

          <label>
            Market *
            <select name="market" required>
              <option value="Primary">Primary</option>
              <option value="Resale">Resale</option>
            </select>
          </label>

          <label>
            Category *
            <select name="category" required>
              <option value="Residential">Residential</option>
              <option value="Commercial">Commercial</option>
              <option value="Land">Land</option>
            </select>
          </label>

          <label>
            Property Type
            <input name="property_type" placeholder="Apartment, Villa, Land...">
          </label>

          <label>
            Price
            <input name="price" placeholder="e.g. 5,000,000 EGP">
          </label>

          <label>
            Size
            <input name="size" placeholder="e.g. 500 m²">
          </label>

          <label>
            Bedrooms
            <input name="bedrooms" placeholder="Not required for land">
          </label>

          <label>
            Payment details
            <input name="payment">
          </label>

          <label>
            Developer
            <input name="developer">
          </label>

          <label>
            Listing status
            <select name="status">
              <option value="active">Active</option>
              <option value="hidden">Hidden</option>
            </select>
          </label>

          <label>
            Description (English)
            <textarea name="description" rows="4"></textarea>
          </label>

          <label>
            Description (Arabic)
            <textarea name="description_ar" rows="4" dir="auto"></textarea>
          </label>

          <label>
            Photos
            <input id="propertyImages" type="file"
                   accept="image/jpeg,image/png,image/webp,image/gif" multiple>
            <small>Image upload needs Cloudinary to be configured.</small>
          </label>

          <label>
            <input type="checkbox" name="featured" value="1">
            Featured listing
          </label>
        </div>

        <div id="imagePreview"></div>

        <div class="form-actions">
          <button type="submit">Save Listing</button>
          <button id="cancelEditor" type="button">Cancel</button>
        </div>

        <p id="editorError" role="alert"></p>
      </form>
    </div>
  </section>

  <div id="adminToast" role="status"></div>

  <script src="/admin.js"></script>
</body>
</html>
